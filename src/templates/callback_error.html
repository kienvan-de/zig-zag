<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Failed — zig-zag</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:         #080810;
      --border:     rgba(255,255,255,0.08);
      --text:       #e8e8f0;
      --text-muted: rgba(232,232,240,0.45);
      --danger:     #f06b6b;
      --danger-glow:rgba(240,107,107,0.2);
      --radius-lg:  14px;
      --font:       -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    body{
      font-family:var(--font);
      font-size:14px;
      line-height:1.5;
      color:var(--text);
      background:var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%,rgba(123,140,255,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%,rgba(240,107,107,0.04) 0%,transparent 60%);
      background-attachment:fixed;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    .card{
      background:rgba(255,255,255,0.03);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:40px;
      max-width:440px;
      width:100%;
      text-align:center;
      backdrop-filter:blur(12px);
      box-shadow:0 4px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .logo{margin-bottom:20px}
    .logo img{width:48px;height:48px;border-radius:10px}
    .icon{
      width:56px;
      height:56px;
      border-radius:50%;
      background:rgba(240,107,107,0.1);
      border:1px solid rgba(240,107,107,0.3);
      box-shadow:0 0 0 1px var(--danger-glow),inset 0 0 20px var(--danger-glow);
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto 20px;
      font-size:24px;
    }
    h1{font-size:20px;font-weight:600;margin-bottom:8px;color:var(--danger)}
    p{color:var(--text-muted);font-size:13px}
    .error-detail{
      margin-top:16px;
      padding:10px 14px;
      background:rgba(240,107,107,0.06);
      border:1px solid rgba(240,107,107,0.15);
      border-radius:8px;
      font-size:12px;
      color:var(--danger);
      word-break:break-word;
    }

    @media(prefers-color-scheme:light){
      :root{
        --bg:         #f0f0f8;
        --border:     rgba(0,0,0,0.08);
        --text:       #1a1a2e;
        --text-muted: rgba(26,26,46,0.5);
        --danger:     #d94040;
        --danger-glow:rgba(217,64,64,0.15);
      }
      body{
        background-image:
          radial-gradient(ellipse 80% 50% at 20% 0%,rgba(92,110,240,0.06) 0%,transparent 60%),
          radial-gradient(ellipse 60% 40% at 80% 100%,rgba(217,64,64,0.04) 0%,transparent 60%);
      }
      .card{
        background:rgba(255,255,255,0.75);
        box-shadow:0 4px 24px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.9);
      }
    }
  </style>
</head>
